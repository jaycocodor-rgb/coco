<title>인사 CFO 사령탑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="data.js"></script>
<style>
  :root{
    --bg:#F2F1EC; --surface:#FFFFFF; --surface-alt:#E9E7E0; --border:#D9D6CC; --border-2:#C6C2B5;
    --ink:#1F1D1A; --ink-2:#58544D; --ink-3:#8B867C;
    --accent:#2E4374; --accent-soft:#E3E7F1; --accent-2:#5A6EA0;
    --good:#2E7D4F; --good-soft:#E3F1E8; --warn:#B8802A; --warn-soft:#F7EDDB; --crit:#B23B3B; --crit-soft:#F8E4E2;
    --fn-prod:#3F6C8F; --fn-sales:#8A5A3B; --fn-rnd:#4F7A63; --fn-admin:#6B5B8A;
    --shadow:0 1px 2px rgba(31,29,26,.05),0 4px 14px rgba(31,29,26,.05);
    --radius:11px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#16171A; --surface:#1E2025; --surface-alt:#262930; --border:#383C45; --border-2:#4A4F5A;
      --ink:#E9EAEC; --ink-2:#A9AEB8; --ink-3:#787E89;
      --accent:#8FA6DC; --accent-soft:#232A3A; --accent-2:#6C82BC;
      --good:#5CB884; --good-soft:#1B2E23; --warn:#DCA74E; --warn-soft:#332916; --crit:#E0817A; --crit-soft:#3A2321;
      --fn-prod:#79A6C9; --fn-sales:#C3906A; --fn-rnd:#83B79C; --fn-admin:#A292C4;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16171A; --surface:#1E2025; --surface-alt:#262930; --border:#383C45; --border-2:#4A4F5A;
    --ink:#E9EAEC; --ink-2:#A9AEB8; --ink-3:#787E89;
    --accent:#8FA6DC; --accent-soft:#232A3A; --accent-2:#6C82BC;
    --good:#5CB884; --good-soft:#1B2E23; --warn:#DCA74E; --warn-soft:#332916; --crit:#E0817A; --crit-soft:#3A2321;
    --fn-prod:#79A6C9; --fn-sales:#C3906A; --fn-rnd:#83B79C; --fn-admin:#A292C4;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       font-size:13.5px;line-height:1.55;display:grid;grid-template-columns:238px 1fr;min-height:100vh;}
  h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',serif;text-wrap:balance;margin:0;}
  .num{font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;font-variant-numeric:tabular-nums;}

  /* ---- sidebar ---- */
  #sidebar{background:var(--surface-alt);border-right:1px solid var(--border);padding:14px 11px 26px;
           position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;}
  .brand{padding:2px 6px 11px;border-bottom:1px solid var(--border-2);margin-bottom:10px;}
  .brand h1{font-size:16.5px;font-weight:700;letter-spacing:-.01em;}
  .brand p{margin:4px 0 0;font-size:10.5px;color:var(--ink-2);line-height:1.45;}
  .brand .stamp{display:inline-block;margin-top:7px;font-size:10px;padding:2px 8px;border-radius:3px;
                background:var(--accent);color:#fff;font-weight:600;letter-spacing:.02em;}
  .nav-item{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:none;border:none;
            padding:6px 8px;border-radius:7px;color:var(--ink-2);font-size:12.4px;font-family:inherit;cursor:pointer;line-height:1.35;}
  .nav-item .idx{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-3);flex:0 0 17px;padding-top:1px;}
  .nav-item:hover{background:var(--surface);color:var(--ink);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .nav-item.active .idx{color:var(--accent);}
  .nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .nav-sep{font-size:10px;letter-spacing:.06em;color:var(--ink-3);padding:12px 8px 4px;font-weight:600;
           border-top:1px dashed var(--border-2);margin-top:8px;}
  .nav-sep:first-of-type{border-top:none;margin-top:2px;}

  /* ---- main ---- */
  #main{padding:16px 22px 44px;min-width:0;}
  .view-head{margin-bottom:12px;}
  .view-title{font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .view-sub{font-size:12px;color:var(--ink-2);margin-top:3px;max-width:78ch;}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 9px;border-radius:999px;
       font-weight:600;letter-spacing:.01em;}
  .tag.real{background:var(--good-soft);color:var(--good);}
  .tag.part{background:var(--warn-soft);color:var(--warn);}
  .tag.plan{background:var(--accent-soft);color:var(--accent);}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:9px;margin-bottom:14px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px;box-shadow:var(--shadow);}
  .kpi .label{font-size:10.5px;color:var(--ink-3);}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:500;margin-top:3px;letter-spacing:-.02em;}
  .kpi .foot{font-size:10.5px;color:var(--ink-2);margin-top:3px;}
  .kpi.lead{border-color:var(--accent);}
  .kpi.bad{border-color:var(--crit);} .kpi.bad .value{color:var(--crit);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
         padding:13px 15px 6px;margin-bottom:14px;}
  .panel.flat{padding-bottom:14px;}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:9px;flex-wrap:wrap;}
  .panel-head h2{font-size:15.5px;font-weight:700;padding-left:10px;border-left:3px solid var(--accent);}
  .panel-note{font-size:11px;color:var(--ink-3);max-width:70ch;}

  .table-scroll{overflow-x:auto;border-top:1px solid var(--border);}
  table.dt{width:auto;min-width:100%;border-collapse:collapse;font-size:12.4px;white-space:nowrap;}
  table.dt td:last-child,table.dt th:last-child{width:99%;}
  table.dt thead th{position:sticky;top:0;background:var(--surface);text-align:left;padding:8px 11px;font-size:10.5px;
                    color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--border-2);z-index:1;}
  table.dt thead th.num{text-align:right;}
  table.dt td{padding:6px 11px;border-bottom:1px solid var(--border);}
  table.dt td.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  table.dt tbody tr:hover{background:var(--surface-alt);}
  table.dt tbody tr:last-child td{border-bottom:none;}
  table.dt td.strong,table.dt th.strong{background:var(--surface-alt);font-weight:700;}
  table.dt tr.total-row td{background:var(--surface-alt);font-weight:700;border-top:2px solid var(--border-2);}
  .rank{color:var(--ink-3);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .pos{color:var(--good);} .neg{color:var(--crit);} .muted{color:var(--ink-3);}

  .sev{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:4px;}
  .sev.치명{background:var(--crit-soft);color:var(--crit);}
  .sev.주의{background:var(--warn-soft);color:var(--warn);}
  .sev.참고{background:var(--accent-soft);color:var(--accent);}
  tr.stripe-치명 td:first-child{box-shadow:inset 3px 0 0 var(--crit);}
  tr.stripe-주의 td:first-child{box-shadow:inset 3px 0 0 var(--warn);}
  tr.stripe-참고 td:first-child{box-shadow:inset 3px 0 0 var(--accent-2);}

  .bar{height:7px;border-radius:3px;background:var(--surface-alt);overflow:hidden;min-width:56px;}
  .bar > i{display:block;height:100%;background:var(--accent);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:11px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow);}
  .card h3{font-size:14.5px;margin-bottom:6px;}
  .card .eyebrow{font-size:10px;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin-bottom:4px;}
  .card p{margin:5px 0;font-size:12.3px;color:var(--ink-2);}
  .card .metric{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink);font-weight:500;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.2px;margin-top:8px;}
  .kv dt{color:var(--ink-3);} .kv dd{margin:0;}

  .searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
  .searchbar input,.searchbar select{font-family:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--border-2);
        border-radius:7px;background:var(--surface);color:var(--ink);}
  .searchbar input{flex:1 1 200px;min-width:0;}
  .searchbar input:focus-visible,.searchbar select:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .person-list{max-height:330px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;}
  .person-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border);
        cursor:pointer;font-size:12.4px;background:none;border-left:none;border-right:none;border-top:none;width:100%;
        text-align:left;font-family:inherit;color:var(--ink);}
  .person-row:hover{background:var(--surface-alt);}
  .person-row[aria-selected="true"]{background:var(--accent-soft);}
  .person-row .sub{font-size:10.5px;color:var(--ink-3);}
  .slip{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;}
  .slip section{border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .slip h4{margin:0;padding:7px 11px;font-size:11.5px;background:var(--surface-alt);font-weight:700;
           font-family:'IBM Plex Sans KR',sans-serif;letter-spacing:.02em;}
  .slip .line{display:flex;justify-content:space-between;gap:10px;padding:4px 11px;font-size:12.2px;border-top:1px solid var(--border);}
  .slip .line span:last-child{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .slip .line.tot{background:var(--surface-alt);font-weight:700;}

  .steps{counter-reset:s;display:grid;gap:9px;}
  .step{display:grid;grid-template-columns:30px 1fr;gap:11px;background:var(--surface);border:1px solid var(--border);
        border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);}
  .step .qn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);font-weight:600;
            border-right:1px solid var(--border);padding-right:8px;}
  .step h3{font-size:14px;margin-bottom:3px;}
  .step p{margin:4px 0 0;font-size:12.3px;color:var(--ink-2);}

  .foot-note{font-size:11px;color:var(--ink-3);padding:7px 2px 9px;max-width:88ch;line-height:1.5;}
  .view{display:none;} .view.active{display:block;}
  .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .spark{display:flex;align-items:flex-end;gap:2px;height:30px;}
  .spark i{flex:1;background:var(--accent-2);border-radius:1px 1px 0 0;min-height:1px;}
  .spark i.hi{background:var(--crit);}

  @media (max-width:900px){
    body{grid-template-columns:1fr;}
    #sidebar{position:relative;height:auto;max-height:none;border-right:none;border-bottom:1px solid var(--border);}
    #main{padding:14px 16px 40px;}
  }
</style>

<div id="sidebar">
  <div class="brand">
    <h1>인사 CFO 사령탑</h1>
    <p>코코도르 · 코코도르팜 전사 인건비 진단<br>기준월 2026-02 · 154명 실측</p>
    <span class="stamp">실측 급여대장 기반</span>
  </div>
  <nav id="nav"></nav>
</div>

<div id="main"><div id="content"></div></div>

<script>
(function(){
  "use strict";
  var D = window.HR_DATA;

  /* ---------- formatters ---------- */
  function won(n){ if(n===null||n===undefined||isNaN(n)) return '-';
    var s=n<0?'-':''; return s+Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원'; }
  function man(n){ if(n===null||n===undefined||isNaN(n)) return '-';
    var s=n<0?'-':''; n=Math.abs(n);
    if(n>=100000000) return s+(n/100000000).toFixed(2)+'억원';
    if(n>=10000) return s+Math.round(n/10000).toLocaleString('ko-KR')+'만원';
    return s+Math.round(n).toLocaleString('ko-KR')+'원'; }
  function eok(n){ return (n===null||n===undefined||isNaN(n))?'-':((n<0?'-':'')+(Math.abs(n)/100000000).toFixed(2)+'억원'); }
  function pct(n,d){ return (n===null||n===undefined||isNaN(n))?'-':(n*100).toFixed(d===undefined?1:d)+'%'; }
  function cnt(n){ return (n===null||n===undefined||isNaN(n))?'-':Math.round(n).toLocaleString('ko-KR'); }
  function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function sign(n,f){ if(n===null||n===undefined||isNaN(n)) return '-';
    return '<b class="'+(n>=0?'pos':'neg')+'">'+(n>0?'+':'')+(f||won)(n)+'</b>'; }

  var FN_COLOR={'생산·물류':'var(--fn-prod)','영업·마케팅':'var(--fn-sales)','상품·연구개발':'var(--fn-rnd)','경영지원':'var(--fn-admin)','기타':'var(--ink-3)'};
  var FUNC={'생산·물류':['음성생산','용인생산','온라인물류','온라인물류*','본사물류','음성물류','포장','음성관리','원예운영','고성'],
            '영업·마케팅':['전략영업팀','해외온라인','온라인영업','영업관리','국내B2B','해외B2B','쿠팡그룹','마케팅그룹','CX'],
            '상품·연구개발':['상품그룹','디자인연구소','디자인그룹','오일연구소','품질','기획'],
            '경영지원':['재무/인사','총무','구매','임원','미지정']};
  var FMAP={}; Object.keys(FUNC).forEach(function(f){ FUNC[f].forEach(function(d){ FMAP[d]=f; }); });
  function fnOf(d){ return FMAP[d]||'기타'; }
  function fnDot(d){ return '<span class="dot" style="background:'+FN_COLOR[fnOf(d)]+'"></span>'; }

  function table(cols, rows, maxH, rowCls){
    var h='<div class="table-scroll"'+(maxH?' style="max-height:'+maxH+';overflow-y:auto"':'')+'><table class="dt"><thead><tr>';
    cols.forEach(function(c){ h+='<th class="'+[(c.num?'num':''),(c.cls||'')].join(' ').trim()+'">'+c.label+'</th>'; });
    h+='</tr></thead><tbody>';
    rows.forEach(function(r,i){
      var rc=rowCls?(rowCls(r,i)||''):'';
      h+='<tr'+(rc?' class="'+rc+'"':'')+'>';
      cols.forEach(function(c){ h+='<td class="'+[(c.num?'num':''),(c.cls||'')].join(' ').trim()+'">'+c.render(r,i)+'</td>'; });
      h+='</tr>';
    });
    return h+'</tbody></table></div>';
  }
  function bar(v,max){ var w=max>0?Math.max(1,Math.round(v/max*100)):0;
    return '<span class="bar"><i style="width:'+w+'%"></i></span>'; }
  function head(t,s,tag){ return '<div class="view-head"><div class="view-title">'+t+
    (tag?' <span class="tag '+tag[0]+'">'+tag[1]+'</span>':'')+'</div><div class="view-sub">'+s+'</div></div>'; }
  function kpi(label,val,foot,cls){ return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="label">'+label+
    '</div><div class="value">'+val+'</div>'+(foot?'<div class="foot">'+foot+'</div>':'')+'</div>'; }
  function panel(title,note,body,flat){ return '<div class="panel'+(flat?' flat':'')+'"><div class="panel-head"><h2>'+title+'</h2>'+
    (note?'<div class="panel-note">'+note+'</div>':'')+'</div>'+body+'</div>'; }

  var TOT = D.costBase.월인건비, HC = D.headcount.전체;

  /* =================== 0. 요약 =================== */
  function v0(){
    var crit=D.issues.filter(function(i){return i.심각도==='치명';}).length;
    var warn=D.issues.filter(function(i){return i.심각도==='주의';}).length;
    var ot=D.costBase.연장수당총계;
    var h=head('인사 CFO 요약','2026년 2월 급여대장 실측 154명 기준. 아래 11개 메뉴의 핵심 결론만 모았습니다.',['real','실측']);
    h+='<div class="kpi-row">'+
      kpi('월 인건비 (2026-02)',eok(TOT),'연환산 '+eok(D.costBase.연환산),'lead')+
      kpi('재직 인원',cnt(HC)+'명','코코도르 '+D.headcount.코코도르+' · 코팜 '+D.headcount.코코도르팜)+
      kpi('1인 평균 월급여',man(D.talentFacts['1인평균']),'평균 근속 '+D.talentFacts.평균근속+'년')+
      kpi('연장수당 비중',pct(ot/TOT),'월 '+man(ot)+' (고정+실적)')+
      kpi('검증 미스',D.issues.length+'건','치명 '+crit+' · 주의 '+warn+' · 참고 '+(D.issues.length-crit-warn),'bad')+
      kpi('절감 가능액(연)',eok(D.savingsTotal),'6개 과제 합산 추정')+
      '</div>';

    h+='<div class="cards">';
    [['진단 1','인건비의 22%가 연장수당이다',
      '고정연장수당이 월 '+man(D.costBase.고정연장수당)+'(총액의 '+pct(D.costBase.고정연장수당/TOT)+')으로 '+
      D.allowances.filter(function(a){return a.항목==='고정연장수당';})[0].수령인원+'명에게 지급됩니다. 실적연장·휴일특근 '+
      man(D.costBase.실적연장수당)+'를 더하면 월 '+man(ot)+'. 기본급 외 최대 비용 항목이며, 절감 여지가 가장 큰 영역입니다.'],
     ['진단 2','인원의 56%가 근속 3년 미만',
      '근속 1년 미만이 '+D.talentFacts.근속1년미만+'명('+pct(D.talentFacts.근속1년미만/HC)+'), 3년 미만이 '+
      D.talentFacts.근속3년미만+'명('+pct(D.talentFacts.근속3년미만/HC)+')입니다. 10년 이상은 '+D.talentFacts.근속10년이상+
      '명뿐입니다. 조기이직이 상시화되면 채용·교육비가 고정비처럼 누적됩니다.'],
     ['진단 3','4대보험 미가입 1건은 즉시 조치 대상',
      D.issues.filter(function(i){return i.검증항목.indexOf('R7')===0;}).map(function(i){return i.대상+'('+i.소속+')';}).join(', ')+
      ' — 최저임금을 넘는 급여를 받으면서 국민연금·건강보험이 모두 0원입니다. 취득신고 누락이면 소급보험료와 과태료가 발생합니다.'],

  }

    {id:'v4', n:'4',  t:'개인별 급여 히스토리 조회',       f:v4},
    {id:'v5', n:'5',  t:'각종 수당 현황',               f:v5},

    {id:'v12',n:'·',  t:'데이터 출처 및 한계',           f:v12}
  ];
  var cur='v0';
  function buildNav(){
    var h='<div class="nav-sep">현황 진단</div>';
    VIEWS.forEach(function(v,i){
      if(v.id==='v7') h+='<div class="nav-sep">전략 설계</div>';
      if(v.id==='v12') h+='<div class="nav-sep">부록</div>';
      h+='<button class="nav-item'+(v.id===cur?' active':'')+'" data-v="'+v.id+'"><span class="idx">'+v.n+'</span><span>'+v.t+'</span></button>';
    });
    document.getElementById('nav').innerHTML=h;
    document.querySelectorAll('[data-v]').forEach(function(b){
      b.addEventListener('click',function(){ go(b.getAttribute('data-v')); });
    });
  }
  function go(id){
    cur=id; buildNav();
    var v=VIEWS.filter(function(x){return x.id===id;})[0];
    var el=document.getElementById('content');
    try{ el.innerHTML=v.f(); }
    catch(err){ el.innerHTML='<div class="panel flat"><h2>화면을 그리지 못했습니다</h2><p class="panel-note">'+esc(err.message)+'</p></div>'; return; }
    window.scrollTo(0,0);
    if(id==='v3'){
      var s=document.getElementById('sevSel'), q=document.getElementById('issQ');
      if(s) s.addEventListener('change',function(){ v3Sev=s.value; renderIssues(); });
      if(q) q.addEventListener('input',renderIssues);
      renderIssues();
    }
    if(id==='v4'){
      var pq=document.getElementById('pQ'), pd=document.getElementById('pDept');
      if(pq) pq.addEventListener('input',function(){ v4Sel=null; renderPeople(); });
      if(pd) pd.addEventListener('change',function(){ v4Dept=pd.value; v4Sel=null; renderPeople(); });
      renderPeople();
    }
  }
  buildNav(); go('v0');
})();
